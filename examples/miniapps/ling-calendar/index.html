<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>日历</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><span class="eyebrow">我的时间</span><h1>把日子安排好。</h1><p>日程保存在本机，随时回来看看。</p></header>
<section class="calendar" aria-label="月历"><div class="monthbar"><div><span id="year"></span><h2 id="month"></h2></div><div class="controls"><button id="prev" aria-label="上个月">‹</button><button id="today">今天</button><button id="next" aria-label="下个月">›</button></div></div><div class="week" aria-hidden="true"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div><div id="days" class="days"></div></section>
<section class="agenda"><div class="section-heading"><div><span class="eyebrow">当天安排</span><h2 id="selectedDate"></h2></div><span id="count"></span></div><div id="events"></div></section>
<p id="status" role="status" aria-live="polite"></p><button id="add" class="primary add">＋ 新增日程</button><footer>本地日程 · 不同步系统日历 · 无闹铃</footer></main>
<dialog id="editor"><form id="eventForm"><div class="dialog-heading"><h2 id="editorTitle">新增日程</h2><button type="button" id="close" aria-label="关闭">×</button></div><label>标题<input id="titleInput" maxlength="80" required placeholder="例如：散步、读书、约朋友"></label><div class="fields"><label>日期<input id="dateInput" type="date" required></label><label>时间（可选）<input id="timeInput" type="time"></label></div><label>备注<textarea id="noteInput" maxlength="2000" rows="3" placeholder="需要记住的小事"></textarea></label><p class="hint">只保存日程，不设置提醒或闹钟。</p><p id="formError" role="alert"></p><div class="actions"><button type="button" id="delete" class="danger" hidden>删除</button><button type="submit" id="save" class="primary">保存日程</button></div></form></dialog>
<dialog id="deleteDialog"><h2>删除这条日程？</h2><p>删除后无法恢复。</p><div class="actions"><button id="cancelDelete">保留</button><button id="confirmDelete" class="danger">确认删除</button></div></dialog>
<script src="app.js"></script></body></html>
